name: Daily Expiry Alerts Schedule

on:
  schedule:
    # 09:00 Europe/London (08:00 UTC during BST, 09:00 UTC during GMT)
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-expiry-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check London Local Time Window
        id: time-check
        run: |
          LONDON_HOUR=$(TZ=Europe/London date +%k | tr -d ' ')
          LONDON_MIN=$(TZ=Europe/London date +%M | tr -d ' ')
          echo "Current London local time: ${LONDON_HOUR}:${LONDON_MIN}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger via workflow_dispatch. Running job."
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "$LONDON_HOUR" -eq 9 ] && [ "$LONDON_MIN" -le 35 ]; then
            echo "Inside target 09:00 London local time window. Running job."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Outside 09:00 London target window (Current London time: ${LONDON_HOUR}:${LONDON_MIN}). Exiting quietly."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Daily Expiry Scan Endpoint
        if: steps.time-check.outputs.should_run == 'true'
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$SECRET" ]; then
            SECRET="${{ secrets.PORTAL_SHARED_SECRET }}"
          fi

          if [ -z "$SECRET" ]; then
            echo "::error::Secret CRON_SECRET (or PORTAL_SHARED_SECRET) is empty or not configured in repository secrets!"
            exit 1
          fi

          echo "Triggering POST request to /api/public/expiry-alerts endpoint..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://hq.virtual-carhire.co.uk/api/public/expiry-alerts" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${SECRET}" \
            --header "X-Cron-Secret: ${SECRET}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP Status Code: ${HTTP_STATUS}"
          echo "Response Body: ${BODY}"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Daily expiry scan endpoint returned error HTTP status ${HTTP_STATUS}"
            exit 1
          fi
