name: Daily Expiry Alerts Schedule

# Sends the staff "Fleet MOT & PCO Expiry Summary" email via the CRM.
#
# Required GitHub Actions repository secret:  CRON_SECRET
# Required Cloudflare Pages secret (CRM):     CRON_SECRET   (must be the SAME value)
#
# GitHub delays scheduled runs (often by hours), so this does NOT insist on an exact
# 09:00 window. It runs any time after 09:00 Europe/London; the CRM endpoint only sends
# once per London day (job_runs), so the two cron entries and any retries cannot double-send.

on:
  schedule:
    - cron: '0 8 * * *'   # 09:00 London during BST
    - cron: '0 9 * * *'   # 09:00 London during GMT
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if today's summary was already sent"
        type: boolean
        default: false

jobs:
  run-expiry-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check London time
        id: time-check
        run: |
          LONDON_HOUR=$(TZ=Europe/London date +%-H)
          echo "London time: $(TZ=Europe/London date '+%H:%M')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$LONDON_HOUR" -ge 9 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Before 09:00 London; the other schedule entry will run it."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger fleet expiry scan
        if: steps.time-check.outputs.should_run == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::GitHub Actions secret CRON_SECRET is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          URL="https://hq.virtual-carhire.co.uk/api/public/expiry-alerts"
          if [ "$FORCE" = "1" ]; then URL="${URL}?force=1"; fi

          HTTP_STATUS=$(curl -sS -o body.json -w "%{http_code}" -X POST "$URL" \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -H "Content-Type: application/json" \
            -H "User-Agent: vch-github-actions-cron/1.0" \
            -H "X-Cron-Secret: ${CRON_SECRET}") || true

          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response: $(head -c 2000 body.json)"

          case "$HTTP_STATUS" in
            200) echo "Expiry scan completed." ;;
            401) echo "::error::CRM rejected the secret. GitHub secret CRON_SECRET must equal the Cloudflare Pages secret CRON_SECRET."; exit 1 ;;
            503) echo "::error::CRM is missing CRON_SECRET in its Cloudflare Pages environment."; exit 1 ;;
            403) echo "::error::403 from Cloudflare (not the app). Cloudflare bot protection is blocking GitHub runners. Add a WAF skip rule for /api/public/expiry-alerts, or rely on the Supabase pg_cron schedule."; exit 1 ;;
            *) echo "::error::Expiry scan failed with HTTP ${HTTP_STATUS}."; exit 1 ;;
          esac
