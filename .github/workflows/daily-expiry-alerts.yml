name: Daily Expiry Alerts Schedule

on:
  schedule:
    # 09:00 London local time (08:00 UTC during BST, 09:00 UTC during GMT)
    - cron: '0 8,9 * * *'
  workflow_dispatch:

jobs:
  run-expiry-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Expiry Scan Endpoint
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$SECRET" ]; then
            SECRET="${{ secrets.PORTAL_SHARED_SECRET }}"
          fi

          curl -X POST "https://hq.virtual-carhire.co.uk/api/public/expiry-alerts" \
            --fail \
            --show-error \
            --silent \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${SECRET}"
