name: Daily Job Watchdog

on:
  schedule:
    # 09:30 UTC daily (09:30 Europe/London)
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  check-job-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Daily Job Executions via Watchdog API
        run: |
          RESPONSE=$(curl -s -X GET "https://hq.virtual-carhire.co.uk/api/jobs/watchdog" \
            --header "Content-Type: application/json")

          echo "Watchdog response: $RESPONSE"

          STATUS=$(echo "$RESPONSE" | grep -o '"ok":true' || true)
          if [ -z "$STATUS" ]; then
            echo "Watchdog reported an error or missing job execution!"

            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
            TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"

            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=⚠️ VCH Watchdog Alert: Daily background job missing or failed! Details: ${RESPONSE}"
            fi
            exit 1
          fi
          echo "All daily jobs verified successfully."
