name: Daily Job Watchdog

# Checks that today's expiry scan ran (job_runs) and runs it as a fallback if not.
#
# Required GitHub Actions repository secret:  CRON_SECRET  (same value as the Cloudflare Pages secret CRON_SECRET)
# Optional GitHub Actions secrets for alerts: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: '30 9 * * *'   # 10:30 BST / 09:30 GMT (GitHub may run this later; that is fine)
  workflow_dispatch:

jobs:
  check-job-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify daily jobs and trigger fallback if missing
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::GitHub Actions secret CRON_SECRET is not set."
            exit 1
          fi

          HTTP_STATUS=$(curl -sS -o body.json -w "%{http_code}" -X POST "https://hq.virtual-carhire.co.uk/api/jobs/watchdog" \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 180 \
            -H "Content-Type: application/json" \
            -H "User-Agent: vch-github-actions-cron/1.0" \
            -H "X-Cron-Secret: ${CRON_SECRET}") || true

          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response: $(head -c 2000 body.json)"

          if [ "$HTTP_STATUS" != "200" ]; then
            case "$HTTP_STATUS" in
              401) MSG="CRM rejected CRON_SECRET (GitHub and Cloudflare values differ)" ;;
              503) MSG="CRM is missing CRON_SECRET in Cloudflare Pages" ;;
              403) MSG="Cloudflare bot protection blocked the GitHub runner (403)" ;;
              *)   MSG="Watchdog returned HTTP ${HTTP_STATUS}" ;;
            esac
            echo "::error::${MSG}"
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=⚠️ VCH Watchdog: ${MSG}" > /dev/null
            fi
            exit 1
          fi
          echo "All daily jobs verified."
